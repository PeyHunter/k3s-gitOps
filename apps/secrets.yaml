# Every SealedSecret in secrets/. Each file sets its own namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PeyHunter/k3s-gitops.git
    targetRevision: main
    path: secrets
    directory:
      exclude: "*.md"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false        # deleting a file here must never delete a live Secret
      selfHeal: true
