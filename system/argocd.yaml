apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: kube-system
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  version: 10.9.3                 # Argo CD v3.5.3. To upgrade, change this and push
  targetNamespace: argocd
  createNamespace: true
  valuesContent: |-
    global:
      domain: argocd.peytonhunter.com
    configs:
      params:
        server.insecure: true     # Traefik does HTTPS; Argo speaks plain http behind it
    dex:
      enabled: false              # no GitHub/Google login, the admin user is enough
    notifications:
      enabled: false              # no Slack/email alerts for now
    server:
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        tls: true                 # cert-manager fills secret "argocd-server-tls"
