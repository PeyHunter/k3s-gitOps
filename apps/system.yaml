apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PeyHunter/k3s-gitops.git
    targetRevision: main
    path: system
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false        # never auto-delete Argo, DNS or the cert issuer
      selfHeal: true
