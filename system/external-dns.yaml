apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: external-dns
  namespace: kube-system
spec:
  repo: https://kubernetes-sigs.github.io/external-dns/
  chart: external-dns
  targetNamespace: external-dns
  valuesContent: |-
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: apiKey
    sources:
      - ingress              # watch Ingress hostnames
    domainFilters:
      - peytonhunter.com       # only touch this domain
    policy: upsert-only      # create and update, never delete (safe while learning)
    txtOwnerId: k3s-1        # marks which records this cluster owns
