# 1. The folder
apiVersion: v1
kind: Namespace
metadata:
  name: pathfinder
---
# 2. The disk: 1 GiB that stays when the pod restarts. pathfinder.db lives here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pathfinder-data
  namespace: pathfinder
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
# 3. The app: one copy, because only one program may write the SQLite file
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathfinder
  namespace: pathfinder
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pathfinder
  template:
    metadata:
      labels:
        app: pathfinder
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: app
          # kustomization.yaml sets the real version (newTag)
          image: ghcr.io/peyhunter/pathfinder:latest
          ports:
            - containerPort: 4000
          env:
            - name: DATABASE_FILE
              value: /app/data/pathfinder.db
            - name: SPEND_LIMIT_USD
              value: "25"
          envFrom:
            - secretRef:
                name: pathfinder-env
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /
              port: 4000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pathfinder-data
---
# 4. One fixed address inside the cluster: port 80 in, port 4000 on the pod
apiVersion: v1
kind: Service
metadata:
  name: pathfinder
  namespace: pathfinder
spec:
  selector:
    app: pathfinder
  ports:
    - port: 80
      targetPort: 4000
---
# 5. The front-door rule: pathfinder.peytonhunter.com → that Service, over HTTPS,
#    first through the two Middlewares below. external-dns makes the DNS record.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pathfinder
  namespace: pathfinder
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: pathfinder-redirect-https@kubernetescrd,pathfinder-login@kubernetescrd
spec:
  tls:
    - hosts:
        - pathfinder.peytonhunter.com
      secretName: pathfinder-tls
  rules:
    - host: pathfinder.peytonhunter.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pathfinder
                port:
                  number: 80
---
# 6. Send http:// visitors to https://
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: pathfinder
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# 7. Ask for a password. The users list is in the Secret you made by hand (step 6c).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: login
  namespace: pathfinder
spec:
  basicAuth:
    secret: pathfinder-login
