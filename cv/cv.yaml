# Copy to k3s-gitops/cv/cv.yaml
# 1. The folder
apiVersion: v1
kind: Namespace
metadata:
  name: cv
---
# 2. The staffing rule: one copy is plenty for a static page
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv
  namespace: cv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cv
  template:
    metadata:
      labels:
        app: cv
    spec:
      containers:
        - name: web
          image: ghcr.io/peyhunter/cv:v1.0.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
# 3. The order window: one fixed address for the pod
apiVersion: v1
kind: Service
metadata:
  name: cv
  namespace: cv
spec:
  selector:
    app: cv
  ports:
    - port: 80
---
# 4. The front-door rule: cv.peytonhunter.com → that Service, over HTTPS
#    external-dns reads this host and creates the Cloudflare record for you.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cv
  namespace: cv
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: cv-redirect-https@kubernetescrd
spec:
  tls:
    - hosts:
        - cv.peytonhunter.com
      secretName: cv-tls
  rules:
    - host: cv.peytonhunter.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cv
                port:
                  number: 80
---
# 5. Send http:// visitors to https://
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: cv
spec:
  redirectScheme:
    scheme: https
    permanent: true
