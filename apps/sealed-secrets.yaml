# Sealed Secrets: lets encrypted Secrets live in git (see secrets/README.md).
# The controller holds the only key that can decrypt them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PeyHunter/k3s-gitops.git
    targetRevision: main
    path: charts/sealed-secrets
    helm:
      releaseName: sealed-secrets
      valuesObject:
        # kubeseal looks for this name in kube-system by default
        fullnameOverride: sealed-secrets-controller
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false        # never auto-delete the controller or its key
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
